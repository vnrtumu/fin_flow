events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting zone for basic protection
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream api_gateway {
        # In Docker Compose, this resolves to the api-gateway container on port 3000
        server api-gateway:3000;
        # If running Node locally without Docker, you'd use host.docker.internal:3000
    }

    server {
        listen 80;
        server_name localhost;

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Fallback for undefined routes
        location / {
            return 404 '{"success": false, "message": "Route not found via Nginx proxy"}';
            add_header Content-Type application/json;
        }
    }
}
